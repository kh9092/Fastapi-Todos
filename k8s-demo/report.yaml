# Jenkins 가 만든 결과 페이지(ConfigMap report-page)를 nginx 파드가 서비스한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report
  labels:
    app: report
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report
  template:
    metadata:
      labels:
        app: report
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: page
          configMap:
            name: report-page
---
apiVersion: v1
kind: Service
metadata:
  name: report
spec:
  type: NodePort
  selector:
    app: report
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080            # kind-demo.yaml 의 extraPortMappings 가 서버의 8081 번과 이어 준다
