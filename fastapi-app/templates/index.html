<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>To-Do List</h1>
            <div class="progress" aria-live="polite">
                <div class="progress-top">
                    <span>달성률</span>
                    <span id="progress-text">0%</span>
                </div>
                <div class="bar"><div id="bar-fill" class="is-empty"></div></div>
            </div>
        </header>

        <form id="todo-form" class="panel">
            <input type="text" id="title" class="wide" placeholder="제목 (예: 20231234)" aria-label="제목" maxlength="100" required>
            <input type="text" id="description" class="wide" placeholder="설명 (예: 홍길동)" aria-label="설명" maxlength="500">
            <div class="wide row">
                <div class="seg" role="radiogroup" aria-label="우선순위">
                    <input type="radio" name="priority" id="p-high" value="high">
                    <label for="p-high">높음</label>
                    <input type="radio" name="priority" id="p-normal" value="normal" checked>
                    <label for="p-normal">보통</label>
                    <input type="radio" name="priority" id="p-low" value="low">
                    <label for="p-low">낮음</label>
                </div>
                <input type="date" id="due-date" class="grow" aria-label="마감일 (선택)" title="마감일 (선택)">
                <button type="submit" class="btn primary">추가하기</button>
            </div>
        </form>

        <div id="toolbar">
            <input type="text" id="search" placeholder="제목이나 설명으로 검색" aria-label="검색">
            <button type="button" class="filter active" data-filter="all">전체</button>
            <button type="button" class="filter" data-filter="active">미완료</button>
            <button type="button" class="filter" data-filter="done">완료</button>
            <span id="count"></span>
        </div>

        <p id="error" role="alert" hidden></p>
        <ul id="todo-list"></ul>
        <p id="empty" hidden></p>
        <p id="version"></p>
    </div>

    <dialog id="edit-dialog" aria-labelledby="edit-heading">
        <h2 id="edit-heading">할 일 수정</h2>
        <form id="edit-form">
            <label class="field">제목 <input type="text" id="e-title" maxlength="100" required></label>
            <label class="field">설명 <input type="text" id="e-description" maxlength="500"></label>
            <div class="field">우선순위
                <div class="seg spaced" role="radiogroup" aria-label="우선순위">
                    <input type="radio" name="e-priority" id="e-high" value="high">
                    <label for="e-high">높음</label>
                    <input type="radio" name="e-priority" id="e-normal" value="normal">
                    <label for="e-normal">보통</label>
                    <input type="radio" name="e-priority" id="e-low" value="low">
                    <label for="e-low">낮음</label>
                </div>
            </div>
            <label class="field">마감일 <input type="date" id="e-due"></label>
            <div class="buttons">
                <button type="button" class="btn" id="e-cancel">취소</button>
                <button type="submit" class="btn primary">저장하기</button>
            </div>
        </form>
    </dialog>

    <dialog id="key-dialog" aria-labelledby="key-heading">
        <h2 id="key-heading">접근 키가 필요해요</h2>
        <form id="key-form">
            <p id="key-message" class="hint"></p>
            <label class="field">접근 키 <input type="password" id="key-input" autocomplete="off" required></label>
            <div class="buttons">
                <button type="submit" class="btn primary">확인</button>
            </div>
        </form>
    </dialog>

    <canvas id="confetti" aria-hidden="true"></canvas>

    <script src="/static/app.js"></script>
</body>
</html>
