<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 680px; margin: 2rem auto; padding: 0 1rem; }
        form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }
        input[type="text"] { flex: 1 1 10rem; padding: .5rem; }
        input[type="date"], select { padding: .5rem; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: .5rem; padding: .4rem .5rem; border-bottom: 1px solid #e5e5e5;
             border-left: 6px solid #f59e0b; }
        li.p-high   { border-left-color: #dc2626; background: #fef2f2; }
        li.p-normal { border-left-color: #f59e0b; background: #fffbeb; }
        li.p-low    { border-left-color: #16a34a; background: #f0fdf4; }
        li.is-done  { border-left-color: #9ca3af; background: #f5f5f5; }
        li .text { flex: 1; }
        .done { text-decoration: line-through; color: #888; }
        .badge { font-size: .75rem; font-weight: 600; padding: .1rem .5rem; border-radius: 999px; color: #fff; white-space: nowrap; }
        .badge.high   { background: #dc2626; }
        .badge.normal { background: #f59e0b; }
        .badge.low    { background: #16a34a; }
        .badge.done   { background: #9ca3af; }
        .due { font-size: .85rem; color: #666; white-space: nowrap; }
        .overdue { color: #b00020; font-weight: 600; }
        #error { color: #b00020; }
        #toolbar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .75rem; }
        #search { flex: 1 1 8rem; padding: .4rem; }
        .filter { padding: .4rem .7rem; cursor: pointer; }
        .filter.active { background: #333; color: #fff; }
        #count { color: #666; font-size: .9rem; margin-left: auto; }
        #empty { color: #888; padding: 1rem 0; }
        #legend { display: flex; gap: .75rem; font-size: .85rem; color: #555; margin-bottom: .5rem; }
        #legend span::before { content: ""; display: inline-block; width: .75rem; height: .75rem; margin-right: .3rem;
                               border-radius: 2px; vertical-align: middle; }
        #legend .l-high::before   { background: #dc2626; }
        #legend .l-normal::before { background: #f59e0b; }
        #legend .l-low::before    { background: #16a34a; }
        #version { margin-top: 2rem; color: #999; font-size: .8rem; text-align: right; }
    </style>
</head>
<body>
    <h1>To-Do List</h1>
    <form id="todo-form">
        <input type="text" id="title" placeholder="제목 (예: 20231234)" required>
        <input type="text" id="description" placeholder="설명 (예: 홍길동)">
        <select id="priority" title="우선순위">
            <option value="high">높음</option>
            <option value="normal" selected>보통</option>
            <option value="low">낮음</option>
        </select>
        <input type="date" id="due-date" title="마감일 (선택)">
        <button type="submit">Add To-Do</button>
    </form>

    <div id="toolbar">
        <input type="text" id="search" placeholder="검색 (제목·설명)">
        <button type="button" class="filter active" data-filter="all">전체</button>
        <button type="button" class="filter" data-filter="active">미완료</button>
        <button type="button" class="filter" data-filter="done">완료</button>
        <span id="count"></span>
    </div>

    <div id="legend">
        <span class="l-high">높음</span>
        <span class="l-normal">보통</span>
        <span class="l-low">낮음</span>
    </div>

    <p id="error" role="alert" hidden></p>
    <ul id="todo-list"></ul>
    <p id="empty" hidden>표시할 항목이 없습니다.</p>
    <p id="version"></p>

    <script>
        const $ = (id) => document.getElementById(id);
        const listEl = $("todo-list"), errorEl = $("error"), emptyEl = $("empty"), countEl = $("count");

        const PRIORITY_LABEL = { high: "높음", normal: "보통", low: "낮음" };
        const PRIORITY_ORDER = { high: 0, normal: 1, low: 2 };

        let todos = [];            // 서버에서 받아온 전체 목록
        let filter = "all";        // all | active | done
        let keyword = "";          // 검색어

        const today = () => new Date().toLocaleDateString("sv-SE");   // "YYYY-MM-DD"

        // 모든 요청을 한 곳에서 처리하고, 실패는 조용히 넘기지 않는다
        async function api(url, method = "GET", body) {
          const res = await fetch(url, body
            ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
            : { method });
          if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
          return res.status === 204 ? null : res.json();
        }

        // 작업을 실행하고, 실패하면 화면에 이유를 띄운다
        async function run(what, job) {
          try {
            await job();
            errorEl.hidden = true;
          } catch (e) {
            errorEl.textContent = `${what} 실패: ${e.message}`;
            errorEl.hidden = false;
          }
        }

        const load = () => run("목록 불러오기", async () => { todos = await api("/todos"); render(); });
        const save = (id, todo) => run("수정", async () => { await api(`/todos/${id}`, "PUT", todo); await load(); });

        function button(label, onclick) {
          return Object.assign(document.createElement("button"), { textContent: label, onclick });
        }

        // 필터 + 검색 적용 후: 미완료 먼저 → 우선순위 높은 순 → 마감일 빠른 순
        function visibleTodos() {
          const noDate = "9999-99-99";
          return todos
            .filter((t) => filter === "all" || (filter === "done") === t.completed)
            .filter((t) => `${t.title} ${t.description}`.toLowerCase().includes(keyword))
            .sort((a, b) => (a.completed - b.completed)
              || (PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority])
              || (a.due_date || noDate).localeCompare(b.due_date || noDate));
        }

        function render() {
          const shown = visibleTodos();
          const left = todos.filter((t) => !t.completed).length;
          countEl.textContent = `미완료 ${left} / 전체 ${todos.length}`;
          emptyEl.hidden = shown.length > 0;

          listEl.replaceChildren(...shown.map((todo) => {
            const check = Object.assign(document.createElement("input"), {
              type: "checkbox",
              checked: todo.completed,
              onchange: () => save(todo.id, { ...todo, completed: check.checked }),
            });
            const text = Object.assign(document.createElement("span"), {
              textContent: `${todo.title} — ${todo.description}`,
              className: todo.completed ? "text done" : "text",
            });
            const badge = Object.assign(document.createElement("span"), {
              textContent: todo.completed ? "완료" : PRIORITY_LABEL[todo.priority],
              className: `badge ${todo.completed ? "done" : todo.priority}`,
            });

            const li = document.createElement("li");
            li.className = todo.completed ? "is-done" : `p-${todo.priority}`;
            li.append(check, badge, text);

            if (todo.due_date) {                       // 마감일이 있으면 표시하고, 지났으면 빨갛게
              const overdue = !todo.completed && todo.due_date < today();
              li.append(Object.assign(document.createElement("span"), {
                textContent: overdue ? `${todo.due_date} (지남)` : todo.due_date,
                className: overdue ? "due overdue" : "due",
              }));
            }

            li.append(button("Edit", () => edit(todo)), button("Delete", () => remove(todo.id)));
            return li;
          }));
        }

        function edit(todo) {
          const title = prompt("새 제목:", todo.title);
          if (title === null) return;
          const description = prompt("새 설명:", todo.description);
          if (description === null) return;
          const due_date = prompt("마감일 (YYYY-MM-DD, 없으면 비워두세요):", todo.due_date);
          if (due_date === null) return;
          const pr = prompt("우선순위 (1=높음, 2=보통, 3=낮음):",
            { high: "1", normal: "2", low: "3" }[todo.priority]);
          if (pr === null) return;
          const priority = { "1": "high", "2": "normal", "3": "low" }[pr.trim()] || todo.priority;
          save(todo.id, { ...todo, title: title.trim(), description: description.trim(),
                          due_date: due_date.trim(), priority });
        }

        function remove(id) {
          if (!confirm("정말 삭제할까요?")) return;
          run("삭제", async () => { await api(`/todos/${id}`, "DELETE"); await load(); });
        }

        $("todo-form").onsubmit = (event) => {
          event.preventDefault();
          run("추가", async () => {
            await api("/todos", "POST", {
              title: $("title").value.trim(),
              description: $("description").value.trim(),
              due_date: $("due-date").value,
              priority: $("priority").value,
            });
            event.target.reset();
            await load();
          });
        };

        $("search").oninput = (event) => { keyword = event.target.value.trim().toLowerCase(); render(); };

        document.querySelectorAll(".filter").forEach((btn) => {
          btn.onclick = () => {
            filter = btn.dataset.filter;
            document.querySelectorAll(".filter").forEach((b) => b.classList.toggle("active", b === btn));
            render();
          };
        });

        fetch("/version").then((r) => r.json()).then((v) => { $("version").textContent = v.version; }).catch(() => {});

        load();
    </script>
</body>
</html>
